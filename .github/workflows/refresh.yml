name: 가맹점 자료 주간 갱신

on:
  schedule:
    # 매주 월요일 06:00 KST (일요일 21:00 UTC)
    - cron: '0 21 * * 0'
  workflow_dispatch:        # 저장소 Actions 탭에서 수동 실행

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: pip install --quiet pyproj openpyxl

      - name: 직전 자료 보관
        run: cp merchants.json /tmp/merchants_prev.json

      - name: 아동수당 가맹점 수집
        run: python3 crawl.py

      - name: 성남사랑상품권 가맹점 수집
        run: python3 crawl_gift.py

      - name: 자료 가공
        run: python3 build_dataset.py

      # 보고서는 파일로만 주고받는다. 가맹점 이름이 외부 사이트에서 오는 값이라
      # 커밋 메시지나 셸 명령에 직접 끼워 넣으면 주입에 취약해진다.
      - name: 변동 확인
        id: diff
        run: |
          set +e
          python3 diff_report.py /tmp/merchants_prev.json merchants.json > /tmp/report.txt
          CODE=$?
          set -e
          cat /tmp/report.txt
          if [ "$CODE" = "20" ]; then
            echo "자료가 급감해 갱신을 중단합니다." >&2
            exit 1
          fi
          if [ "$CODE" = "10" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          cat /tmp/report.txt >> "$GITHUB_STEP_SUMMARY"

      - name: 커밋 & 푸시
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add merchants.json
          if git diff --cached --quiet; then
            echo "merchants.json 내용이 같아 커밋할 것이 없습니다."
            exit 0
          fi
          { echo "가맹점 자료 자동 갱신"; echo; cat /tmp/report.txt; } > /tmp/commit_msg.txt
          git commit -F /tmp/commit_msg.txt
          git push

      - name: 변동 없음
        if: steps.diff.outputs.changed != 'true'
        run: echo "바뀐 가맹점이 없어 커밋하지 않았습니다."
